[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-statusboard"
version = "0.5.1"
description = "A local statusboard for Claude Code and Codex usage"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cc-statusboard contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
cc-statusboard = "collector.serve_statusboard:main"

[tool.setuptools]
packages = ["collector"]
include-package-data = true

[tool.setuptools.package-data]
collector = ["web-ui/**"]
